<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#111A3A"/>
      <stop offset=".5" stop-color="#302653"/>
      <stop offset="1" stop-color="#102D50"/>
    </linearGradient>
    <linearGradient id="glow" x2="1" y2="1">
      <stop stop-color="#79D9FF"/>
      <stop offset=".5" stop-color="#B69AFF"/>
      <stop offset="1" stop-color="#FFB5D6"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A4C9FF" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="100" cy="50" r="220" fill="#9C69FF" opacity=".18"/>
  <circle cx="1100" cy="320" r="250" fill="#51CFFF" opacity=".16"/>
  <path d="M0 240 Q250 70 480 220 T900 100 T1200 40" stroke="url(#glow)" stroke-width="3" fill="none"/>
  <path d="M0 300 Q300 170 600 280 T1200 220" stroke="#B69AFF" stroke-width="2" fill="none"/>

  <rect x="20" y="20" width="1160" height="300" rx="20" fill="url(#glass)" stroke="url(#glow)" stroke-width="2"/>

  <circle cx="130" cy="165" r="76" fill="url(#glass)" stroke="url(#glow)" stroke-width="3"/>
  <text x="130" y="181" text-anchor="middle" fill="#D9C9FF" font-size="54" font-family="monospace">&lt;/&gt;</text>

  <text x="245" y="100" fill="#FFFFFF" font-size="48" font-weight="bold" font-family="Arial">Hi, I'm Rishika!</text>
  <text x="245" y="145" fill="#B9DFFF" font-size="25" font-family="Arial">Aspiring Software Developer</text>

  <rect x="245" y="165" width="4" height="58" rx="2" fill="#D69EFF"/>
  <text x="265" y="188" fill="#F0ECFF" font-size="18" font-family="Arial">Building meaningful projects, solving real-world</text>
  <text x="265" y="214" fill="#F0ECFF" font-size="18" font-family="Arial">problems, and continuously learning to grow.</text>

  <g font-family="Arial" font-size="16" fill="#FFFFFF">
    <rect x="245" y="245" width="100" height="38" rx="19" fill="url(#glass)" stroke="#B69AFF"/>
    <text x="295" y="270" text-anchor="middle">Java</text>
    <rect x="355" y="245" width="100" height="38" rx="19" fill="url(#glass)" stroke="#79D9FF"/>
    <text x="405" y="270" text-anchor="middle">DSA</text>
    <rect x="465" y="245" width="110" height="38" rx="19" fill="url(#glass)" stroke="#D69EFF"/>
    <text x="520" y="270" text-anchor="middle">React</text>
    <rect x="585" y="245" width="110" height="38" rx="19" fill="url(#glass)" stroke="#79D9FF"/>
    <text x="640" y="270" text-anchor="middle">MySQL</text>
  </g>

  <rect x="910" y="75" width="205" height="135" rx="12" fill="url(#glass)" stroke="url(#glow)" stroke-width="3" transform="rotate(-6 910 75)"/>
  <text x="1010" y="160" fill="#A9DFFF" font-size="48" font-family="monospace" text-anchor="middle">&lt;/&gt;</text>
  <path d="M875 220 L1135 220 L1160 240 L850 240Z" fill="url(#glow)" stroke="#FFFFFF"/>
  <text x="1040" y="290" fill="#D9C9FF" font-size="18" text-anchor="middle" font-family="Arial">CODE • CREATE • GROW</text>
</svg>




